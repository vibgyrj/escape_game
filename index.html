<SCRIPT language=JavaScript type=text/javascript>

var curX, curY, curX2, curY2, boxX, boxY, moving=0, touch=0;
var gametime=0, started=0, speed;
var starttime, endtime, finaltime=0;
var enemyxdir = [1,1,1,1];
var enemyydir = [1,1,1,1];
var animationFrameId = null;

// Add touch event support
function handleStart(e) {
    if (e.touches && e.touches.length > 0) {
        curX = e.touches[0].clientX;
        curY = e.touches[0].clientY;
    } else {
        curX = e.pageX || e.clientX;
        curY = e.pageY || e.clientY;
    }
    start(e);
    e.preventDefault();
}

function handleMove(e) {
    if (e.touches && e.touches.length > 0) {
        curX = e.touches[0].clientX;
        curY = e.touches[0].clientY;
    } else {
        curX = e.pageX || e.clientX;
        curY = e.pageY || e.clientY;
    }
    checkLocation(e);
    e.preventDefault();
}

function handleEnd(e) {
    stop(e);
    e.preventDefault();
}

document.addEventListener('mousedown', handleStart, false);
document.addEventListener('mousemove', handleMove, false);
document.addEventListener('mouseup', handleEnd, false);
document.addEventListener('touchstart', handleStart, false);
document.addEventListener('touchmove', handleMove, false);
document.addEventListener('touchend', handleEnd, false);

function startclock() {starttime = Date.now();}
function endclock() {endtime = Date.now();}
function calctime() {return (endtime - starttime) / 1000;}

function giveposX(divname) {
    return parseInt(document.getElementById(divname).style.left) || 0;
}

function giveposY(divname) {
    return parseInt(document.getElementById(divname).style.top) || 0;
}

function setposX(divname, xpos) {
    document.getElementById(divname).style.left = xpos + 'px';
}

function setposY(divname, ypos) {
    document.getElementById(divname).style.top = ypos + 'px';
}

function givesize(divname, dimension) {
    var element = document.getElementById(divname);
    if (dimension == 'y') {
        return parseInt(element.style.height) || 0;
    } else if (dimension == 'x') {
        return parseInt(element.style.width) || 0;
    }
    return 0;
}

function checktouching(num) {
    var enemy = "enemy" + num;
    var difX = giveposX('box') - giveposX(enemy);
    var difY = giveposY('box') - giveposY(enemy);
    var boxWidth = givesize('box', 'x');
    var boxHeight = givesize('box', 'y');
    var enemyWidth = givesize(enemy, 'x');
    var enemyHeight = givesize(enemy, 'y');

    if (difX > (-1 * boxWidth) && difX < enemyWidth && difY > (-1 * boxHeight) && difY < enemyHeight) {
        touch = 1;
    } else {
        touch = 0;
    }
}

function movenemy(num, step_x, step_y) {
    var enemy = "enemy" + num;
    var enemyx = givesize(enemy, 'x');
    var enemyy = givesize(enemy, 'y');
    var posX = giveposX(enemy);
    var posY = giveposY(enemy);

    if (posX >= (450 - enemyx) || posX <= 0) {
        enemyxdir[num] = -enemyxdir[num];
    }
    if (posY >= (450 - enemyy) || posY <= 0) {
        enemyydir[num] = -enemyydir[num];
    }

    setposX(enemy, posX + (step_x * enemyxdir[num]));
    setposY(enemy, posY + (step_y * enemyydir[num]));

    checktouching(num);
    if (touch == 1) {
        stop();
        reset();
    }
}

function movenemies() {
    gametime++;

    if (gametime < 100) speed = 80;
    else if (gametime < 200) speed = 60;
    else if (gametime < 300) speed = 40;
    else if (gametime < 400) speed = 30;
    else if (gametime < 500) speed = 20;
    else speed = 10;

    movenemy(0, -10, 12);
    movenemy(1, -12, -20);
    movenemy(2, 15, -13);
    movenemy(3, 17, 11);

    animationFrameId = setTimeout(movenemies, speed);
}

function start(e) {
    if (started == 0) {
        movenemies();
        startclock();
        started = 1;
    }

    curX2 = curX - 40;
    curY2 = curY - 40;
    boxX = curX - 20;
    boxY = curY - 20;

    var boxleft = giveposX('box');
    var boxtop = giveposY('box');

    if (curX > boxleft && curX2 < boxleft && curY > boxtop && curY2 < boxtop) {
        moving = 1;
        setposX('box', boxX);
        setposY('box', boxY);
    }
}

function stop(e) {
    moving = 0;
}

function reset(e) {
    endclock();
    moving = 0;
    if (animationFrameId) clearTimeout(animationFrameId);
    
    if (finaltime == 0) {
        finaltime = calctime();
        window.alert('You hold ' + finaltime.toFixed(2) + ' seconds... salutations Fp');
        document.location.reload();
    }
}

function checkLocation(e) {
    boxX = curX - 20;
    boxY = curY - 20;

    checktouching(1);

    if (moving == 1 && touch == 0) {
        setposX('box', boxX);
        setposY('box', boxY);

        if (curY > 69 && curX > 69 && curY < 381 && curX < 381) {
            return false;
        } else {
            stop();
            reset();
        }
    } else if (touch == 1) {
        stop();
        reset();
    }
}

</SCRIPT>
